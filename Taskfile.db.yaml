version: 3

vars:
  DB_DRIVER: postgres
  DB_MIGRATIONS_DIR: /migrations
  DOCKER_COMPOSE: docker-compose -f docker-compose.yaml
  GOOSE_CMD: "{{.DOCKER_COMPOSE}} run --rm goose -dir {{.DB_MIGRATIONS_DIR}}"
  SQLC_CMD: "{{.DOCKER_COMPOSE}} run --rm sqlc"

tasks:
  sqlc:generate:
    desc: Generate all sqlc code
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - task db:sqlc:generate:backend

  sqlc:generate:backend:
    desc: Generate backend Go code from sqlc queries
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - '{{.SQLC_CMD}} generate -f /src/apps/api/sqlc.yaml'

  db:migrate:create:
    desc: >-
      Create a new goose SQL migration. Usage: task -t Taskfile.db.yaml
      db:migrate:create -- migration_name=create_users
    dir: '{{.TASKFILE_DIR}}'
    requires:
      vars:
        - migration_name
    cmds:
      - '{{.GOOSE_CMD}} create {{.migration_name}} sql'

  db:migrate:up:
    desc: Apply all up migrations using goose
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - '{{.GOOSE_CMD}} up'

  db:migrate:up-to:
    desc: >-
      Apply goose up migrations until a specific version. Usage: task
      db:db:migrate:up-to version=20260410093000 DB_URL=postgres://...
    dir: '{{.TASKFILE_DIR}}'
    requires:
      vars:
        - version
    cmds:
      - '{{.GOOSE_CMD}} up-to {{.version}}'

  db:migrate:down:
    desc: Roll back the most recent migration using goose
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - '{{.GOOSE_CMD}} down'

  db:migrate:down-to:
    desc: >-
      Roll back goose migrations down to a specific version. Usage: task
      db:db:migrate:down-to version=20260410093000 DB_URL=postgres://...
    dir: '{{.TASKFILE_DIR}}'
    requires:
      vars:
        - version
    cmds:
      - '{{.GOOSE_CMD}} down-to {{.version}}'

  db:migrate:status:
    desc: Show goose migration status
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - '{{.GOOSE_CMD}} status'

  db:migrate:reset:
    desc: Roll back all goose migrations
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - '{{.GOOSE_CMD}} reset'
